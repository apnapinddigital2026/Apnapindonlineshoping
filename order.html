<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Form</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="order-container">

<h2>🛒 Confirm Your Order</h2>

<div class="order-note">
<h3>🛒 ਆਪਣਾ ਆਰਡਰ ਪੂਰਾ ਕਰੋ</h3>

<p>
ਕਿਰਪਾ ਕਰਕੇ ਆਪਣੀ ਸਹੀ ਜਾਣਕਾਰੀ ਭਰੋ।
<br>
Please fill your correct details.
</p>
</div>

<h3>ਆਪਣਾ ਆਰਡਰ ਪੁਸ਼ਟੀ ਕਰੋ</h3>

<hr>

<h4 id="productName"></h4>

<p id="productCode"></p>

<p id="productPrice"></p>

<hr>

<input type="text" id="customerName"
placeholder="ਪੂਰਾ ਨਾਮ / Full Name">

<input type="text" id="mobile"
placeholder="ਮੋਬਾਈਲ ਨੰਬਰ / Mobile Number">

<input type="text" id="house"
placeholder="ਮਕਾਨ ਨੰਬਰ / House No">

<input type="text" id="street"
placeholder="ਗਲੀ / ਮੁਹੱਲਾ / Street / Mohalla">

<input type="text" id="city"
placeholder="ਪਿੰਡ / ਸ਼ਹਿਰ / Village / City">

<input type="text" id="tehsil"
placeholder="ਤਹਿਸੀਲ / Tehsil">

<input type="text" id="district"
placeholder="ਜ਼ਿਲ੍ਹਾ / District">

<input type="text" id="state"
placeholder="ਰਾਜ / State">

<input type="text" id="pincode"
placeholder="ਪਿੰਨ ਕੋਡ / PIN Code">

<input type="number" id="qty"
placeholder="Quantity"
value="1">

<select id="payment">

<option>Cash on Delivery</option>

<option>Online UPI</option>

</select>

  <button type="button" onclick="window.location.href='payment.html'">
💳 QR Payment
  </button>
  
<input type="text"
id="utr"
placeholder="UPI Transaction ID (if paid online)">

<button onclick="sendOrder()">

📦 Confirm Order

</button>

</div>

<script src="order.js"></script>

</body>

</html>
